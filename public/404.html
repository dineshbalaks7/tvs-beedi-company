<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | TVS Beedi Company</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg-main);
    }
    .error-card {
      width: min(100%, 440px);
      padding: 36px 28px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .error-code {
      color: var(--accent-amber);
      font-family: var(--font-en);
      font-size: clamp(72px, 20vw, 120px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: 0;
    }
    .error-card h1 {
      margin-top: 20px;
      color: var(--text-main);
      font-size: 24px;
    }
    .error-card p {
      margin: 8px 0 24px;
      color: var(--text-muted);
    }
    .error-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      background: var(--accent-amber);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .error-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px var(--accent-amber-glow);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="errorTitle">
      <div class="error-code">404</div>
      <h1 id="errorTitle">Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <a class="error-home" href="/dashboard">Return to dashboard</a>
    </section>
  </main>
</body>
</html>
