<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TVS Beedi Company</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="/images/logo.png" alt="TVS Beedi Company logo">
        <div>
          <strong>TVS Beedi Company</strong>
          <span>Internal Management Portal</span>
        </div>
      </div>
      <div class="login-heading">
        <p class="login-eyebrow">SECURE ACCESS</p>
        <h1 id="loginTitle">Welcome back</h1>
        <p>Sign in to manage production, stock, expenses, and exports.</p>
      </div>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <p id="loginError" class="login-error" role="alert" hidden></p>
        <button id="loginButton" type="submit" class="login-submit-btn">Sign in</button>
        <button id="forgotPasswordLink" type="button" class="login-link-btn">Forgot password?</button>
      </form>
      <form id="forgotPasswordForm" hidden>
        <div class="login-heading forgot-heading">
          <p class="login-eyebrow">ACCOUNT RECOVERY</p>
          <h1>Reset password</h1>
          <p>Enter your username, then choose a new password.</p>
        </div>
        <label for="forgotUsername">Username</label>
        <input id="forgotUsername" name="username" type="text" autocomplete="username" required>
        <div id="newPasswordFields" hidden>
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <p id="forgotError" class="login-error" role="alert" hidden></p>
        <button id="forgotPasswordButton" type="submit" class="login-submit-btn">Continue</button>
        <button id="backToLoginButton" type="button" class="login-link-btn">Back to sign in</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const error = document.getElementById('loginError');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const newPasswordFields = document.getElementById('newPasswordFields');
    const forgotPasswordButton = document.getElementById('forgotPasswordButton');
    const forgotError = document.getElementById('forgotError');
    const backToLoginButton = document.getElementById('backToLoginButton');

    if (new URLSearchParams(window.location.search).get('expired') === '1') {
      error.textContent = 'Your session expired due to inactivity. Please sign in again.';
      error.hidden = false;
      window.history.replaceState({}, document.title, '/login');
    }

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        togglePasswordBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
        
        const eyeIcon = togglePasswordBtn.querySelector('.eye-icon');
        const eyeOffIcon = togglePasswordBtn.querySelector('.eye-off-icon');
        if (eyeIcon && eyeOffIcon) {
          eyeIcon.style.display = isPassword ? 'none' : 'block';
          eyeOffIcon.style.display = isPassword ? 'block' : 'none';
        }
        passwordInput.focus();
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;
      button.textContent = 'Signing in...';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.details ? `${data.error} (${data.details})` : (data.error || 'Invalid username or password'));
        }
        window.location.href = '/dashboard';
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });

    forgotPasswordLink.addEventListener('click', () => {
      form.hidden = true;
      forgotPasswordForm.hidden = false;
      forgotError.hidden = true;
      document.getElementById('forgotUsername').focus();
    });

    backToLoginButton.addEventListener('click', () => {
      forgotPasswordForm.reset();
      newPasswordFields.hidden = true;
      forgotPasswordButton.textContent = 'Continue';
      form.hidden = false;
      forgotPasswordForm.hidden = true;
      document.getElementById('username').focus();
    });

    forgotPasswordForm.addEventListener('submit', async event => {
      event.preventDefault();
      forgotError.hidden = true;

      if (newPasswordFields.hidden) {
        const username = document.getElementById('forgotUsername').value.trim();
        if (!username) return;
        newPasswordFields.hidden = false;
        forgotPasswordButton.textContent = 'Reset password';
        document.getElementById('newPassword').focus();
        return;
      }

      forgotPasswordButton.disabled = true;
      forgotPasswordButton.textContent = 'Resetting...';
      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('forgotUsername').value.trim(),
            newPassword: document.getElementById('newPassword').value,
            confirmPassword: document.getElementById('confirmNewPassword').value
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Unable to reset password');
        forgotPasswordForm.reset();
        newPasswordFields.hidden = true;
        forgotPasswordButton.disabled = false;
        forgotPasswordButton.textContent = 'Continue';
        forgotError.classList.add('login-success');
        forgotError.textContent = 'Password reset successfully. Please sign in with your new password.';
        forgotError.hidden = false;
      } catch (err) {
        forgotError.textContent = err.message;
        forgotError.hidden = false;
        forgotPasswordButton.disabled = false;
        forgotPasswordButton.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
